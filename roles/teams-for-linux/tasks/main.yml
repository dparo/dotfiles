---
- name: Teams For Linux
  tags:
    - never
    - teams-for-linux
  block:
  - name: Import key
    ansible.builtin.rpm_key:
      state: present
      key: https://repo.teamsforlinux.de/teams-for-linux.asc
    become: true

  - name: Enable repo
    ansible.builtin.copy:
      dest: /etc/yum.repos.d/teams-for-linux.repo
      content: |
        [teams-for-linux]
        name=Repo for the unofficial Teams for Linux package
        baseurl=https://repo.teamsforlinux.de/rpm/
        enabled=1
        gpgcheck=1
      mode: "0644"
    become: true

  - name: Install
    ansible.builtin.dnf:
      name:
        - teams-for-linux
    become: true


  - name: Create config directory
    ansible.builtin.file:
      path: "{{ ansible_facts['user_dir'] }}/.config/teams-for-linux"
      state: directory
      mode: "0755"

  - name: Symlink config
    ansible.builtin.file:
      src: "{{ role_path }}/files/{{ item }}"
      dest: "{{ ansible_facts['user_dir'] }}/.config/teams-for-linux/{{ item }}"
      state: link
    loop:
      - config.json

  - name: Configure Teams for Linux to use Wayland
    block:
      - name: Ensure local applications directory exists
        ansible.builtin.file:
          path: "{{ ansible_facts['user_dir'] }}/.local/share/applications"
          state: directory
          mode: "0755"

      - name: Copy Teams desktop entry locally
        ansible.builtin.copy:
          src: /usr/share/applications/teams-for-linux.desktop
          dest: "{{ ansible_facts['user_dir'] }}/.local/share/applications/teams-for-linux.desktop"
          remote_src: true
          mode: "0644"

      - name: Use Wayland for Teams
        ansible.builtin.replace:
          path: "{{ ansible_facts['user_dir'] }}/.local/share/applications/teams-for-linux.desktop"
          regexp: --ozone-platform=x11
          replace: --ozone-platform=wayland
