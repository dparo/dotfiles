---
- name: Atuin
  tags:
    - atuin
  block:
    - name: Install
      ansible.builtin.dnf:
        name:
          - atuin
        state: present
      become: true
    - name: Symlink config
      ansible.builtin.file:
        src: "{{ role_path }}/files"
        dest: "{{ ansible_facts['user_dir'] }}/.config/atuin"
        state: link

